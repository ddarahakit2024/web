name: 에이전트 작업
description: 자동 루프가 처리할 작업. 검토 후 agent:ready 라벨을 붙이면 시작된다.
body:
  - type: textarea
    id: goal
    attributes:
      label: 목표
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 테스트로 확인 가능한 문장으로
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 참고 (문서·코드 경로, 제약, 범위 밖)
