name: Deploy frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Copy built files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_FRONTEND_HOST }}
          port: ${{ secrets.DEPLOY_FRONTEND_PORT }}
          username: ${{ secrets.DEPLOY_FRONTEND_USER }}
          password: ${{ secrets.DEPLOY_FRONTEND_PASSWORD }}
          source: "frontend/dist/**"
          target: "C:/nginx-1.30.5/html"
          strip_components: 2
          overwrite: true

      - name: Copy SPA server to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_FRONTEND_HOST }}
          port: ${{ secrets.DEPLOY_FRONTEND_PORT }}
          username: ${{ secrets.DEPLOY_FRONTEND_USER }}
          password: ${{ secrets.DEPLOY_FRONTEND_PASSWORD }}
          source: "frontend/serve.py"
          target: "~/ai_backend2/frontend"
          strip_components: 1
          overwrite: true

      - name: Restart frontend on port 9000
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_FRONTEND_HOST }}
          port: ${{ secrets.DEPLOY_FRONTEND_PORT }}
          username: ${{ secrets.DEPLOY_FRONTEND_USER }}
          password: ${{ secrets.DEPLOY_FRONTEND_PASSWORD }}
          script: |
            set -eu
            cd "$HOME/ai_backend2/frontend"
            if [ -f frontend.pid ]; then
              old_pid="$(cat frontend.pid)"
              if kill -0 "$old_pid" 2>/dev/null && ps -p "$old_pid" -o args= | grep -q '[s]erve.py --bind 0.0.0.0 --port 9000'; then
                kill "$old_pid"
                for attempt in $(seq 1 20); do
                  kill -0 "$old_pid" 2>/dev/null || break
                  sleep 1
                done
              fi
              rm -f frontend.pid
            fi
            nohup python3 serve.py --bind 0.0.0.0 --port 9000 --directory "$HOME/ai_backend2/frontend" > frontend.log 2>&1 < /dev/null &
            echo $! > frontend.pid
